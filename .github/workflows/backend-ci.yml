name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'deployments/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: backend/RealtimeChat.slnx
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  backend-ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cài SDK .NET và bật NuGet cache.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.SOLUTION_PATH }}

      # Restore dependencies trước khi build solution.
      - name: Install Dependencies & Build
        run: |
          dotnet restore ${{ env.SOLUTION_PATH }}
          dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore -v minimal

      # Chạy test trên các project đã được build.
      - name: Run Tests
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-restore \
            --no-build \
            --logger "trx" \
            --maxcpucount \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/test-results \
            -- RunConfiguration.DisableParallelization=false

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx

      # Tạo báo cáo coverage nếu có dữ liệu.
      - name: Generate Coverage Report
        if: always()
        run: |
          if ! find artifacts/test-results -name 'coverage.cobertura.xml' -type f -print -quit 2>/dev/null | grep -q .; then
            echo "No coverage data found."
            exit 0
          fi

          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.3.11

          reportgenerator \
            "-reports:artifacts/test-results/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

          if [ -f artifacts/coverage-report/SummaryGithub.md ]; then
            cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Lưu kết quả test và báo cáo coverage trong 7 ngày.
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-artifacts
          path: |
            artifacts/test-results/
            artifacts/coverage-report/
          if-no-files-found: warn
          retention-days: 7