name: Backend CI

on:
  push:
    branches:
      - "**"
    paths:
      - backend/**
      - deployments/**
      - docker-compose.yml
      - .github/workflows/backend-ci.yml
      - .github/scripts/**
  pull_request:
    branches: [ main ]
    paths:
      - backend/**
      - deployments/**
      - docker-compose.yml
      - .github/workflows/backend-ci.yml
      - .github/scripts/**

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: read

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: backend/RealtimeChat.slnx
  UNIT_TEST_PROJECT: backend/RealtimeChat.UnitTests/RealtimeChat.UnitTests.csproj
  INTEGRATION_TEST_PROJECT: backend/RealtimeChat.IntegrationTests/RealtimeChat.IntegrationTests.csproj
  BUILD_CONFIGURATION: Release

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore
