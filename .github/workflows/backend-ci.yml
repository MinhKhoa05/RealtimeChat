name: Backend CI

on:
  push:
    paths:
      - backend/**
      - tests/**
      - deployments/**
      - docker-compose.yml
      - .github/workflows/backend-ci.yml
      - .github/scripts/**
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: backend/RealtimeChat.slnx

jobs:
  backend-ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          skip-lts-prepass: true

      # Cache NuGet packages giữa các lần chạy.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'tests/**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config', '**/packages.lock.json', 'backend/RealtimeChat.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build & Test
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            -m \
            --logger "trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/test-results

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx

      - name: Generate Coverage Report
        if: always()
        run: |
          if ! find artifacts/test-results -name 'coverage.cobertura.xml' -type f -print -quit 2>/dev/null | grep -q .; then
            echo "No coverage data found."
            exit 0
          fi

          dotnet tool install --global dotnet-reportgenerator-globaltool

          reportgenerator \
            "-reports:artifacts/test-results/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

          if [ -f artifacts/coverage-report/SummaryGithub.md ]; then
            cat artifacts/coverage-report/SummaryGithub.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-artifacts
          path: |
            artifacts/test-results/
            artifacts/coverage-report/
          if-no-files-found: warn
          retention-days: 7