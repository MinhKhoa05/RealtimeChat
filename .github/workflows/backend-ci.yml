
name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'deployments/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: backend/RealtimeChat.slnx
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  backend-ci:
    name: Build & Test
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Dọn artifact cũ của lượt chạy trước.
      - name: Clean Workspace Artifacts
        shell: powershell
        run: |
          if (Test-Path artifacts) {
            Remove-Item -Path artifacts -Recurse -Force
          }

      # 2. Thiết lập SDK .NET.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Khôi phục dependency và build solution.
      # NuGet có thể tái sử dụng package đã lưu trong cache cục bộ.
      - name: Restore & Build
        shell: powershell
        run: |
          dotnet restore $env:SOLUTION_PATH
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          dotnet build $env:SOLUTION_PATH `
            --configuration Release `
            --no-restore `
            --verbosity minimal

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 4. Chạy test trên output đã build, không build lại.
      - name: Run Tests
        id: tests
        shell: powershell
        run: |
          dotnet test $env:SOLUTION_PATH `
            --configuration Release `
            --no-restore `
            --no-build `
            --logger "trx" `
            --maxcpucount `
            --collect:"XPlat Code Coverage" `
            --results-directory artifacts/test-results `
            -- RunConfiguration.DisableParallelization=false

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # 5. Xuất kết quả test kể cả khi test thất bại,
      # nhưng bỏ qua nếu workflow bị hủy.
      - name: Publish Test Results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        continue-on-error: true
        with:
          name: Test Results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx

      # 6. Tạo báo cáo coverage nếu có dữ liệu.
      - name: Generate Coverage Report
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $coverageFiles = @(
            Get-ChildItem `
              -Path artifacts/test-results `
              -Filter coverage.cobertura.xml `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue
          )

          if ($coverageFiles.Count -eq 0) {
            Write-Host "Không tìm thấy dữ liệu coverage."
            exit 0
          }

          # Dùng lại ReportGenerator nếu đã cài trong profile của runner.
          $toolDir = Join-Path $env:USERPROFILE ".dotnet\tools"
          $reportGenerator = Join-Path $toolDir "reportgenerator.exe"

          if (-not (Test-Path $reportGenerator)) {
            dotnet tool install --global `
              dotnet-reportgenerator-globaltool `
              --version 5.3.11

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          if (-not (Test-Path $reportGenerator)) {
            Write-Error "Không tìm thấy ReportGenerator: $reportGenerator"
            exit 1
          }

          New-Item -ItemType Directory `
            -Force artifacts/coverage-report | Out-Null

          & $reportGenerator `
            "-reports:artifacts/test-results/**/coverage.cobertura.xml" `
            "-targetdir:artifacts/coverage-report" `
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # Đưa bản tóm tắt coverage vào phần tổng kết GitHub Actions.
          $summaryFile = "artifacts/coverage-report/SummaryGithub.md"

          if (Test-Path $summaryFile) {
            Get-Content $summaryFile |
              Add-Content $env:GITHUB_STEP_SUMMARY
          }

      # 7. Lưu kết quả test và báo cáo coverage trong 7 ngày.
      - name: Upload Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-artifacts
          path: |
            artifacts/test-results/
            artifacts/coverage-report/
          if-no-files-found: warn
          retention-days: 7
