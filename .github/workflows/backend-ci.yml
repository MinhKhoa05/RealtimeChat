name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "deployments/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch: # Cho phép chạy CI thủ công.

# Hủy lần chạy cũ khi có lần chạy mới trên cùng branch/ref.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # Đọc source code.
  checks: write # Cho phép tạo check/test report.

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION_PATH: backend/RealtimeChat.slnx
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  backend-ci:
    name: Build & Test
    runs-on: ubuntu-latest # Dùng runner Ubuntu do GitHub cung cấp.

    steps:
      # Lấy source code về runner.
      - name: Checkout
        uses: actions/checkout@v4

      # Cài SDK .NET và cache NuGet theo lock files.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          skip-lts-prepass: true
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      # Restore dependency và build Release; không restore lại khi build.
      - name: Restore & Build
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore "$SOLUTION_PATH"

          dotnet build "$SOLUTION_PATH" \
            --configuration Release \
            --no-restore \
            --verbosity minimal

      # Chạy test trên output đã build, thu kết quả TRX và coverage.
      - name: Run Tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          dotnet test "$SOLUTION_PATH" \
            --configuration Release \
            --no-restore \
            --no-build \
            --logger "trx" \
            --maxcpucount \
            --collect:"XPlat Code Coverage" \
            --results-directory artifacts/test-results \
            -- RunConfiguration.DisableParallelization=false

      # Xuất test report ngay cả khi test thất bại; bỏ qua khi bị hủy.
      - name: Publish Test Results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        continue-on-error: true
        with:
          name: Test Results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx

      # Tạo báo cáo HTML, Cobertura và summary nếu có dữ liệu coverage.
      - name: Generate Coverage Report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s globstar nullglob
          coverage_files=(artifacts/test-results/**/coverage.cobertura.xml)

          if [ ${#coverage_files[@]} -eq 0 ]; then
            echo "Không tìm thấy dữ liệu coverage."
            exit 0
          fi

          # Cài ReportGenerator nếu runner chưa có.
          tool_dir="$HOME/.dotnet/tools"
          report_generator="$tool_dir/reportgenerator"

          if [ ! -x "$report_generator" ]; then
            dotnet tool install --global \
              dotnet-reportgenerator-globaltool \
              --version 5.3.11
          fi

          if [ ! -x "$report_generator" ]; then
            echo "::error::Không tìm thấy ReportGenerator: $report_generator"
            exit 1
          fi

          mkdir -p artifacts/coverage-report

          "$report_generator" \
            "-reports:artifacts/test-results/**/coverage.cobertura.xml" \
            "-targetdir:artifacts/coverage-report" \
            "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

          # Hiển thị tóm tắt coverage trong GitHub Actions.
          summary_file="artifacts/coverage-report/SummaryGithub.md"

          if [ -f "$summary_file" ]; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Lưu test results và coverage để tải xuống trong 7 ngày.
      - name: Upload Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-artifacts
          path: |
            artifacts/test-results/
            artifacts/coverage-report/
          if-no-files-found: warn
          retention-days: 7
