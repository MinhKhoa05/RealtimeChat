name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - frontend/**
      - deployments/**
      - docker-compose.yml
      - .github/workflows/frontend-ci.yml

  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - deployments/**
      - docker-compose.yml
      - .github/workflows/frontend-ci.yml

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Build
        run: npm run typecheck && npm run build
