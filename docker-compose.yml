services:

  db:
    image: mariadb:11
    container_name: realtime_chat_db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: realtime_chat_db
      MARIADB_USER: realtime_chat_user
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -uroot -p\"$${MARIADB_ROOT_PASSWORD}\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: realtime_chat_api
    restart: unless-stopped

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=realtime_chat_db;User=realtime_chat_user;Password=${DB_PASSWORD}"

      Jwt__Key: ${Jwt__Key:?Set Jwt__Key in .env}
      App__BaseUrl: ${App__BaseUrl:?Set App__BaseUrl in .env}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:?Set Cors__AllowedOrigins__0 in .env}

    volumes:
      - media_data:/data/media

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: realtime_chat_web
    restart: unless-stopped

    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: realtime_chat_nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/data/media:ro

    depends_on:
      - api
      - frontend

volumes:
  db_data:
  media_data: